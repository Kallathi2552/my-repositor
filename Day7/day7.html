<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<style>
html, body {
    margin: 0;
    padding: 0;
    background-color: black;
    font-family: Arial, sans-serif;
}
ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    padding: 0;
    margin: 0;
    width: 100%;
}
ul li {
    padding: 40px;
    background-color: #111;   
    color: #fff;                 
    border: 2px solid #333;      
    font-size: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
}
ul li span:last-child {
    display: inline-block;          
    transition: transform 0.3s ease;
    transform: rotate(-45deg);
}
ul li:hover {
    transform: translateY(-5px); 
    border-color: yellow;        
    box-shadow: 0 0 20px 5px yellow; 
}
ul li:hover span:last-child {
    transform: rotate(-45deg) scale(2.5);
}
.image-text-box {
    display: flex;
    align-items: center;
    margin: 20px;
    gap: 20px; 
}
.image-box {
    width: 450px;                 
    height: 400px;                
    border: 2px solid #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transition: transform 0.3s ease;
}
.image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
}
.image-box:hover img {
    transform: scale(1.2);
}
.text-box {
    color: #fff;
    max-width: 400px;
}
.text-box h2 {
    margin: 0 0 10px 0;
    font-size: 28px;
    color: yellow;
}
.text-box p {
    margin: 0;
    line-height: 1.4;
}

</style>
<ul>
    <li><span>Luffy</span><span>➜</span></li>
    <li><span>Zoro</span><span>➜</span></li>
    <li><span>Sanji</span><span>➜</span></li>
    <li><span>Jinbei</span><span>➜</span></li>
    <li><span>Brook</span><span>➜</span></li>
</ul>
<div class="image-text-box">
    <div class="image-box">
        <img src="luffy.jpg" alt="Luffy">
    </div>
    <div class="text-box">
        <h2>Luffy</h2>
        <p>The captain of the Straw Hat Pirates, known for his adventurous spirit and rubber powers.</p>
    </div>
</div>
</body>
</html>
