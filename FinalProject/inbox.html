<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Feedback Inbox</title>
<style>
:root {
  --bg-color: #ffffff;
  --text-color: #000;
  --card-bg: rgba(255,255,255,0.95);
  --card-text: #000;
}

body.dark {
  --bg-color: #121212;
  --text-color: #fff;
  --card-bg: #1e1e1e;
  --card-text: #fff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}
body{
  min-height:100vh;
  background:var(--bg-color);
  color:var(--text-color);
  padding:40px;
  overflow:hidden;
  transition:0.3s;
}

/* FALLING LEAVES */
.leaves{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}
.leaf{
  position:absolute;
  top:-120px;
  opacity:0.85;
  animation:leafFall linear infinite;
}
@keyframes leafFall{
  0%{ transform:translateX(0) translateY(0) rotate(0deg); }
  25%{ transform:translateX(-30px) translateY(25vh) rotate(90deg); }
  50%{ transform:translateX(30px) translateY(50vh) rotate(180deg); }
  75%{ transform:translateX(-20px) translateY(75vh) rotate(270deg); }
  100%{ transform:translateX(10px) translateY(120vh) rotate(360deg); }
}

/* TITLE */
h1{
  text-align:center;
  margin-bottom:30px;
  background:linear-gradient(135deg,#87cefa,#5dade2);
  color:#fff;
  padding:18px 25px;
  border-radius:16px;
  width:fit-content;
  margin-left:auto;
  margin-right:auto;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  position:relative;
  z-index:2;
}

/* BACK BUTTON */
.back-btn{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:16px;
  margin-bottom:25px;
  cursor:pointer;
  color:#0072ff;
  font-weight:500;
  transition:0.2s;
}
.back-btn:hover{
  opacity:0.8;
  text-decoration:underline;
}

/* FEEDBACK GRID */
.dashboard{
  max-width:900px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
  position:relative;
  z-index:2;
}

/* FEEDBACK CARD */
.feedback-card{
  background:var(--card-bg);
  color:var(--card-text);
  border-radius:16px;
  padding:20px;
  box-shadow:0 15px 30px rgba(0,0,0,0.15);
  cursor:pointer;
  transition:transform 0.3s, box-shadow 0.3s, background 0.3s, color 0.3s;
}
.feedback-card:hover{
  transform:translateY(-5px);
  box-shadow:0 20px 35px rgba(0,0,0,0.2);
}
.feedback-card img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:15px;
}
.feedback-card h3{ font-size:18px; margin-bottom:5px; color:#0072ff; }
.feedback-card span{ font-size:13px; opacity:0.7; margin-bottom:10px; display:block; }
.feedback-card p{ margin:10px 0; font-size:14px; line-height:1.5; }
.feedback-card small{ font-size:12px; color:#666; display:block; margin-top:5px; }

/* MODAL */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:1000;
}
.modal{
  background:var(--card-bg);
  color:var(--card-text);
  padding:25px;
  border-radius:16px;
  max-width:400px;
  width:90%;
  text-align:center;
  box-shadow:0 15px 30px rgba(0,0,0,0.25);
  position:relative;
  transition:background 0.3s, color 0.3s;
}
.modal img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:15px;
}
.modal h3{margin-bottom:10px; color:#0072ff;}
.modal span{color:green;font-weight:bold;display:block;margin-bottom:10px;}
.modal p{color:var(--text-color);margin-bottom:8px;}
.modal small{color:#666;display:block;margin-bottom:5px;}
.close-btn{
  position:absolute;
  top:10px;
  right:10px;
  background:#ff416c;
  color:#fff;
  border:none;
  padding:6px 12px;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="leaves" id="leaves"></div>

<!-- BACK BUTTON -->
<div class="back-btn" onclick="goBack()">← Back to Products</div>

<h1>User Feedback Inbox</h1>
<div class="dashboard" id="dashboard"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent">
    <button class="close-btn" onclick="closeModal()">Close</button>
    <img id="modalImg" src="" alt="Product Image">
    <h3 id="modalName"></h3>
    <span id="modalRating"></span>
    <p id="modalMessage"></p>
    <small id="modalEmail"></small>
    <small id="modalDate"></small>
  </div>
</div>

<script>
// BACK BUTTON
function goBack(){
  window.location.href = "user.html";
}

// Get logged-in user
const currentUser = JSON.parse(localStorage.getItem("currentUser"));

// Load feedbacks
let feedbacks = JSON.parse(localStorage.getItem("feedbacks")) || [];
const dashboard = document.getElementById("dashboard");

// MODAL ELEMENTS
const modalOverlay = document.getElementById("modalOverlay");
const modalImg = document.getElementById("modalImg");
const modalName = document.getElementById("modalName");
const modalRating = document.getElementById("modalRating");
const modalMessage = document.getElementById("modalMessage");
const modalEmail = document.getElementById("modalEmail");
const modalDate = document.getElementById("modalDate");

// LEAF EFFECT
const leavesContainer = document.getElementById("leaves");
const leafEmojis = ["🍂","🍁"];
function createLeaf(){
  const leaf = document.createElement("div");
  leaf.className="leaf";
  leaf.textContent = leafEmojis[Math.floor(Math.random()*leafEmojis.length)];
  leaf.style.left=Math.random()*100+"vw";
  leaf.style.fontSize=18+Math.random()*24+"px";
  const duration = 10 + Math.random()*6;
  leaf.style.animationDuration=duration+"s";
  leavesContainer.appendChild(leaf);
  setTimeout(()=>leaf.remove(), duration*1000);
}
setInterval(createLeaf, 300);

// RENDER FEEDBACKS SENT BY LOGGED-IN USER
function renderFeedbacks(){
  dashboard.innerHTML = "";

  if(!currentUser){
    dashboard.innerHTML = "<p style='text-align:center;color:#555;'>Please log in to view your feedbacks.</p>";
    return;
  }

  // Filter only feedbacks sent by logged-in user
  const userFeedbacks = feedbacks.filter(f => f.email === currentUser.email);

  if(!userFeedbacks.length){
    dashboard.innerHTML = "<p style='text-align:center;color:#555;'>You have not sent any feedback yet.</p>";
    return;
  }

  userFeedbacks.forEach((f) => {
    const card = document.createElement("div");
    card.className = "feedback-card";
    card.innerHTML = `
      <img src="${f.img || 'placeholder.jpg'}" alt="Product Image">
      <h3>${f.name}</h3>
      <span>Rating: ${f.rating}</span>
      <p>${f.message.substring(0, 50)}${f.message.length > 50 ? '...' : ''}</p>
      <small>Email: ${f.email}</small>
      <small>Date: ${f.date}</small>
    `;
    card.addEventListener("click", () => {
      modalImg.src = f.img || 'placeholder.jpg';
      modalName.textContent = f.name;
      modalRating.textContent = "Rating: " + f.rating;
      modalMessage.textContent = f.message;
      modalEmail.textContent = "Email: " + f.email;
      modalDate.textContent = "Date: " + f.date;
      modalOverlay.style.display = "flex";
    });
    dashboard.appendChild(card);
  });
}

function closeModal(){
  modalOverlay.style.display = "none";
}

// THEME SYNC WITH USER.HTML
if(localStorage.getItem("theme")==="dark") document.body.classList.add("dark");

renderFeedbacks();
</script>

</body>
</html>
