<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Gallery</title>
<style>
:root {
  --bg-color: #f1f3f6;
  --text-color: #000;
  --card-bg: #fff;
  --card-text: #000;
}

body.dark {
  --bg-color: #121212;
  --text-color: #fff;
  --card-bg: #1e1e1e;
  --card-text: #fff;
}

* {margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body {background:var(--bg-color);color:var(--text-color);padding:30px;position:relative;transition:0.3s;overflow-x:hidden;}

/* Leaf Effect */
.leaves{position:fixed;inset:0;pointer-events:none;z-index:0;}
.leaf{position:absolute;top:-50px;font-size:20px;opacity:0.8;animation-name:fallLeaf;animation-timing-function:linear;animation-iteration-count:infinite;}
@keyframes fallLeaf{0%{transform:translate(0,-50px) rotate(0deg);}25%{transform:translate(-30px,25vh) rotate(90deg);}50%{transform:translate(30px,50vh) rotate(180deg);}75%{transform:translate(-20px,75vh) rotate(270deg);}100%{transform:translate(20px,110vh) rotate(360deg);}}

.header{display:flex;align-items:center;margin-bottom:20px;position:relative;z-index:1;}
.hamburger{font-size:28px;cursor:pointer;margin-right:20px;}
h1{flex:1;text-align:center;}
.theme-btn{position:absolute;right:0;top:0;padding:6px 12px;margin:4px;border:none;border-radius:6px;background:black;color:#fff;cursor:pointer;font-size:18px;z-index:1;}

/* Sidebar */
.sidebar{position:fixed;left:-250px;top:0;width:250px;height:100%;background:white;color:black;padding:20px;transition:left 0.3s;display:flex;flex-direction:column;z-index:1000;}
.sidebar.dark{background:#1e1e1e;color:white;}
.sidebar.active{left:0;}
.sidebar .user-info{margin-bottom:30px;}
.sidebar .user-info h3{margin-bottom:5px;}
.sidebar a{color:inherit;text-decoration:none;margin:10px 0;display:flex;align-items:center;font-size:16px;transition:background 0.2s;padding:8px 12px;border-radius:8px;}
.sidebar a:hover{background:rgba(0,0,0,0.05);}
.sidebar .logout{margin-top:auto;background:#ff4b2b;justify-content:center;color:#fff;}
.sidebar .logout:hover{background:#ff416c;}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:none;z-index:900;}

/* Product Grid */
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;position:relative;z-index:1;}
.card{background:var(--card-bg);color:var(--card-text);border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,0.15);padding:15px;cursor:pointer;transition:transform 0.2s, background 0.3s, color 0.3s;text-align:center;}
.card:hover{transform:translateY(-5px);}
.card img{width:100%;height:160px;object-fit:cover;border-radius:10px;}
.card h3{font-size:16px;margin:10px 0 5px;}
.card span{color:green;font-weight:bold;display:block;margin-bottom:10px;}
.card a{text-decoration:none;color:inherit;display:block;}
</style>
</head>
<body>

<div class="leaves" id="leaves"></div>

<div class="header">
  <span class="hamburger" onclick="toggleSidebar()">☰</span>
  <h1>Products</h1>
  <button class="theme-btn" id="themeBtn">🌙</button>
</div>

<div class="sidebar" id="sidebar">
  <div class="user-info">
    <h3>Contact</h3>
    <p>contact@example.com</p>
  </div>
  <a href="inbox.html">Inbox</a>
  <a href="received.html">Received</a>
  <a href="login.html" class="logout">Logout</a>
</div>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="products">
  <div class="card">
    <a href="product.html?name=One piece Keychain&price=₹299&img=img1.jpg">
      <img src="img1.jpg" alt="One piece Keychain">
      <h3>One piece Keychain</h3>
      <span>₹299</span>
    </a>
  </div>
  <div class="card">
    <a href="product.html?name=One piece bracelet&price=₹599&img=img2.jpg">
      <img src="img2.jpg" alt="One piece bracelet">
      <h3>One piece bracelet</h3>
      <span>₹599</span>
    </a>
  </div>
    <div class="card">
    <a href="product.html?name=One piece Action Figure&price=₹299&img=img3.jpg">
      <img src="img3.jpg" alt="One piece Keychain">
      <h3>One piece Action Figure</h3>
      <span>₹299</span>
    </a>
  </div>
    <div class="card">
    <a href="product.html?name=Naruto Action Figure&price=₹299&img=img4.jpg">
      <img src="img4.jpg" alt="One piece Keychain">
      <h3>Naruto Action Figure</h3>
      <span>₹299</span>
    </a>
  </div>
    <div class="card">
    <a href="product.html?name=Naruto Keychain&price=₹299&img=img5.jpg">
      <img src="img5.jpg" alt="One piece Keychain">
      <h3>Naruto Keychain</h3>
      <span>₹299</span>
    </a>
  </div>
    <div class="card">
    <a href="product.html?name=Naruto Skin&price=₹299&img=img6.jpg">
      <img src="img6.jpg" alt="One piece Keychain">
      <h3>Naruto Skin</h3>
      <span>₹299</span>
    </a>
  </div>
</div>

<script>
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const themeBtn = document.getElementById("themeBtn");
const leavesContainer = document.getElementById("leaves");

// Sidebar toggle
function toggleSidebar(){
  sidebar.classList.toggle("active");
  overlay.style.display = sidebar.classList.contains("active") ? "block":"none";
}
function closeSidebar(){
  sidebar.classList.remove("active");
  overlay.style.display="none";
}

// Leaf animation
const leafEmojis = ["🍂","🍁"];
function createLeaf(){
  const leaf = document.createElement("div");
  leaf.className="leaf";
  leaf.textContent = leafEmojis[Math.floor(Math.random()*leafEmojis.length)];
  leaf.style.left=Math.random()*100+"vw";
  leaf.style.fontSize=16+Math.random()*22+"px";
  leaf.style.animationDuration=6+Math.random()*6+"s";
  leavesContainer.appendChild(leaf);
  setTimeout(()=>leaf.remove(),12000);
}
setInterval(createLeaf,500);

// THEME
function setTheme(dark){
  if(dark){
    document.body.classList.add("dark");
    sidebar.classList.add("dark");
    themeBtn.textContent = "☀️";
    localStorage.setItem("theme","dark");
  } else {
    document.body.classList.remove("dark");
    sidebar.classList.remove("dark");
    themeBtn.textContent = "🌙";
    localStorage.setItem("theme","light");
  }
}
themeBtn.addEventListener("click", ()=>{
  setTheme(!document.body.classList.contains("dark"));
});
if(localStorage.getItem("theme")==="dark") setTheme(true);

// DYNAMIC SIDEBAR USER INFO
window.addEventListener("DOMContentLoaded", ()=>{
  const userInfo = document.querySelector(".sidebar .user-info");
  const currentUser = JSON.parse(localStorage.getItem("currentUser"));

  if(currentUser && currentUser !== "admin"){
    userInfo.innerHTML = `
      <h3>${currentUser.username}</h3>
      <p>${currentUser.email}</p>
    `;
  } else if(currentUser === "admin"){
    userInfo.innerHTML = `
      <h3>Admin</h3>
      <p>admin@example.com</p>
    `;
  }
});
</script>
</body>
</html>
