<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
             background-color: #2d67ee;
        }
        .m{
            background: rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            padding: 50px;
            margin-top: 250px;
            margin-left: 350px;
        }
        #total{
            color: white;
        }
        label{
            color: white;
        }
        button{
            padding: 10px 15px;
            color: white;
            background-color:  #f38219;

        }
        input{
            padding: 5px 12px;
        }
    </style>
    <section class="all">
    <div class="m">
    <label>Enter Your Marks :</label>
    <input type="text" id="marks"><br><br>
    <button onclick="total()">Submit</button>
    <h2 id="total"></h2>
    </div>
    <script>
        function total(){
        var input=document.getElementById("marks").value;
        var marks=input.split(',').map(Number);
        var t=0;
        for(i=0;i<marks.length;i++)
        {
            t = t+marks[i];
        }
        document.getElementById("total").innerHTML= "Total Marks: "+t;
    }
    </script>
    </section>
</body>
</html>
